# Cloudflare Workers configuration: an assets-only Worker that serves the
# built static site. There is no Worker script; every request is answered
# from site/_site. Headers come from site/_site/_headers (copied from
# site/src/_headers at build time).
#
# Workers Builds settings (dashboard → the Worker → Settings → Build):
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Root directory:  /
name = "the-trust"
compatibility_date = "2026-09-01"

[assets]
directory = "./site/_site"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[build]
command = "npm run build"
send_metrics = false

# workers.dev: no production URL (trust.forum is the canonical origin and the
# only Cloudflare mirror listed); preview URLs stay on for pull-request previews.
workers_dev = false
preview_urls = true

# Observability: keep the dashboard toggle on across deploys, but do not keep
# per-request invocation logs. Those record every visitor's URL, which the site
# promises not to do (Constitution III.6, Protocol 11). Aggregate metrics
# (request and error counts, no identifiers) remain in the Worker's Metrics tab.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
