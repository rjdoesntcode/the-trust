<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t d">
  <title id="t">The Trust and the Bridge</title>
  <desc id="d">Two equal points standing on one line, joined by a single arc: two kinds of member on one record, connected by the Bridge.</desc>
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3556cc"/>
      <stop offset="1" stop-color="#7a4fe0"/>
    </linearGradient>
  </defs>
  <!-- the Record: one line both kinds stand on -->
  <path d="M8 44 H56" stroke="#1f2440" stroke-width="4" stroke-linecap="round"/>
  <!-- the Bridge: one arc from one kind to the other, open, nothing enclosed -->
  <path d="M16 38 C 22 12, 42 12, 48 38" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round"/>
  <!-- the two kinds: equal, standing on the same line -->
  <circle cx="16" cy="38" r="5.5" fill="#3556cc"/>
  <circle cx="48" cy="38" r="5.5" fill="#7a4fe0"/>
</svg>
