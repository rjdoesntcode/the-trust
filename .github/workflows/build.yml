# Build on every push and pull request; deploy the GitHub Pages mirror from main.
# Actions are pinned to full commit SHAs (the tag is kept as a comment). Dependabot
# proposes bumps; scripts/pin-actions.sh re-resolves tags to SHAs if one slips in.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install (pinned lockfile)
        run: npm ci --no-audit --no-fund
        working-directory: site
      - name: Unit tests (anchor scheme)
        run: npm test
        working-directory: site
      - name: Verify canonical hashes, validate Register, build, check output
        run: bash scripts/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/_site
  # Deploys the mirror. Fails until GitHub Pages is enabled for the repository
  # (Settings -> Pages -> Source: GitHub Actions, or scripts/github-setup.sh);
  # the Actions token cannot enable it. The `build` job above is the required
  # status check and is unaffected.
  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
