# Build on every push and pull request; deploy the GitHub Pages mirror from main.
# Actions are pinned to full commit SHAs (the tag is kept as a comment). Dependabot
# proposes bumps; scripts/pin-actions.sh re-resolves tags to SHAs if one slips in.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install (pinned lockfile)
        run: npm ci --no-audit --no-fund
        working-directory: site
      - name: Unit tests (anchor scheme)
        run: npm test
        working-directory: site
      - name: Verify canonical hashes, validate Register, build, check output
        run: bash scripts/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/_site
  # Deploys the GitHub Pages mirror. GitHub Pages must be enabled once by the
  # repository owner (Settings -> Pages -> Source: GitHub Actions); the Actions
  # token cannot enable it. Until then this job reports a warning and passes,
  # so that the required `build` check and the run stay green while the
  # primary site (trust.forum) is unaffected.
  deploy-github-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        name: Is GitHub Pages enabled for this repository?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; deploying the mirror."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages mirror not deployed::GitHub Pages is not enabled for this repository. Enable it once at Settings -> Pages -> Source: GitHub Actions; the mirror deploys on the next push to main. The primary site is unaffected."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
